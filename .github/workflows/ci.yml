name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-and-test:
    # Zwitcher targets net10.0-windows (WPF), so it can only build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the SDK version pinned in global.json.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
      # Catches a broken publish before release time. The zip isn't uploaded.
      - run: ./build/publish.ps1
        shell: pwsh
